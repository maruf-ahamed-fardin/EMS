# Render blueprint for the API (demo deploy, docs/deployment.md "Demo: Render and Vercel").
# Render builds apps/api/Dockerfile (its last stage, `runtime`). It never deploys on its own:
# .github/workflows/deploy-api.yml runs the migrations first, then calls the deploy hook.
# Secrets are marked sync: false, so Render asks for them in its dashboard and they never live here.
services:
  - type: web
    name: ems-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/ready
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Browser -> Vercel (the /api rewrite) -> Render's proxy -> the API
      - key: TRUST_PROXY_HOPS
        value: '2'
      # A single instance, so it runs the background jobs
      - key: JOBS_ENABLED
        value: 'true'
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_REGION
        value: auto
      - key: MAIL_DRIVER
        value: smtp
      # The web app's public https URL, e.g. https://teamprofile-lime.vercel.app
      - key: APP_URL
        sync: false
      # postgresql://…?sslmode=require (the direct, non-pooled connection string)
      - key: DATABASE_URL
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
