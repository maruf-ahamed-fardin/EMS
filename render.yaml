# Render blueprint: the whole EMS in one deploy, on Render's free plan.
#   Render dashboard -> New -> Blueprint -> pick this repository -> fill in the values it asks for.
# It creates a Postgres database and one web service that runs both the API and the web app
# (render.Dockerfile). Every start runs the migrations and the catalogue sync first
# (scripts/render-start.sh), and every push to the branch deploys again.
#
# Free plan limits: the service sleeps after 15 minutes without traffic (background jobs such as
# closing attendance days only run while it is awake) and the free database expires after 30 days.
# For a real deploy use a paid plan, or the separate images in apps/api and apps/web.
# Secrets are marked sync: false, so Render asks for them in its dashboard and they never live here.

databases:
  - name: ems-db
    plan: free
    region: singapore
    databaseName: ems
    user: ems
    postgresMajorVersion: '16'

services:
  - type: web
    name: ems
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./render.Dockerfile
    dockerContext: .
    # Goes through the web app's /api rewrite to the API and its database check, so it covers both
    healthCheckPath: /api/v1/health/ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      # Render's internal address for the database, on its private network
      - key: DATABASE_URL
        fromDatabase:
          name: ems-db
          property: connectionString
      # The internal connection has no TLS; it never leaves Render's private network
      - key: DATABASE_ALLOW_INSECURE
        value: 'true'
      # Browser -> Render's proxy -> the web app's /api rewrite -> the API
      - key: TRUST_PROXY_HOPS
        value: '2'
      # A single instance, so it runs the background jobs
      - key: JOBS_ENABLED
        value: 'true'
      # APP_URL defaults to this service's own https URL (RENDER_EXTERNAL_URL); set it for a custom domain

      # The first Super Admin, created on the first start. Then use "Forgot password?" on the sign-in page.
      - key: ADMIN_EMAIL
        sync: false

      # Production requires real email (password resets) and S3 storage (the container's disk is wiped
      # on every deploy and restart). Cloudflare R2 and most SMTP providers have free tiers.
      - key: MAIL_DRIVER
        value: smtp
      # smtp://user:password@host:587
      - key: SMTP_URL
        sync: false
      # e.g. SeloraX People <no-reply@your-domain>
      - key: MAIL_FROM
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_REGION
        value: auto
      - key: S3_BUCKET
        sync: false
      # https://<account-id>.r2.cloudflarestorage.com
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
