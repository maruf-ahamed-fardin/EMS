# Local MySQL for development and the database tests. Not used in production.
#
#   docker compose up -d
#   npm run db:migrate
#   TEST_DATABASE_URL=mysql://root@127.0.0.1:3307/teamprofile_test npm test
#
# Port 3307 so it never clashes with a MySQL already running on 3306.

services:
  db:
    image: mysql:8.4
    ports: ['3307:3306']
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    # The collation matters: unique usernames rely on it ignoring letter case
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - ./scripts/db-init.sql:/docker-entrypoint-initdb.d/00-databases.sql:ro
      - db-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  db-data:
