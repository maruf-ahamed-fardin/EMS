# Yarn 4, pinned into the repository so CI, the images and every machine run the same release.
yarnPath: .yarn/releases/yarn-4.18.0.cjs

# A real node_modules, not Plug'n'Play: Prisma's generated client, argon2's native binding and
# Next's standalone tracing all resolve through the filesystem.
nodeLinker: node-modules

# ── Supply-chain guards (see docs/architecture.md, "Dependencies") ───────────────────────────────
# These replace the npm settings this repository used before the move to Yarn, one for one:
#   min-release-age=7  ->  npmMinimalAgeGate
#   ignore-scripts     ->  enableScripts
#   save-exact         ->  defaultSemverRangePrefix
# A package must have been public for a week before it can be installed.
npmMinimalAgeGate: "1w"
# Third-party postinstall scripts never run. Packages with native code use their prebuilt binaries.
enableScripts: false
# Dependencies are pinned exactly; no ^ or ~ ranges.
defaultSemverRangePrefix: ""

# CI and the images install with `yarn install --immutable`, which is what `npm ci` used to do.
