name: Deploy API

# Manual, from GitHub (Actions -> Deploy API -> Run workflow), so no deploy runs from a developer PC
# (docs/security.md). The release step comes first: migrations and the catalogue sync, then Render
# builds and starts the new API through its deploy hook (render.yaml turns Render's own auto-deploy off).
on:
  workflow_dispatch:
    inputs:
      seed:
        description: Reset the demo data (demo users, activity, documents). Never on real data.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets live in the "demo" environment: Settings -> Environments -> demo
    environment: demo
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      # Before installing anything, as in ems.yml
      - name: Hidden payload check
        run: node scripts/check-payload.mjs
      - run: yarn install --immutable
      - run: yarn db:generate
      - name: Build
        run: yarn workspace @ems/contracts run build && yarn workspace @ems/backend run build

      - name: Migrations
        run: yarn db:deploy
      - name: Catalogue sync
        run: yarn workspace @ems/backend run catalogue:sync

      # The seed refuses NODE_ENV=production, and writes its PDFs to the API's bucket so downloads work
      - name: Demo data
        if: ${{ inputs.seed }}
        env:
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
          STORAGE_DRIVER: s3
          S3_REGION: auto
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: yarn db:seed

      - name: Deploy on Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$HOOK" > /dev/null
