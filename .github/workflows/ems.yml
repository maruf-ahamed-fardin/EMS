name: EMS

on:
  push:
    branches: [main]
    paths: ['ems/**', '.github/workflows/ems.yml']
  pull_request:
    paths: ['ems/**', '.github/workflows/ems.yml']

permissions:
  contents: read

concurrency:
  group: ems-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ems

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ems
          POSTGRES_PASSWORD: ems-ci
          POSTGRES_DB: ems_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U ems -d ems_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: postgresql://ems:ems-ci@127.0.0.1:5432/ems_test
      SHADOW_DATABASE_URL: postgresql://ems:ems-ci@127.0.0.1:5432/ems_shadow
      TEST_DATABASE_URL: postgresql://ems:ems-ci@127.0.0.1:5432/ems_test
      API_ORIGIN: http://127.0.0.1:4000
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ems/package-lock.json
      # Before installing anything: a compromised config file must never get as far as running
      - name: Hidden payload check
        run: node scripts/check-payload.mjs
      - run: npm ci
      - name: Known vulnerabilities in dependencies
        run: npm audit --audit-level=high
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run lint
      - name: Create the shadow database
        run: PGPASSWORD=ems-ci psql -h 127.0.0.1 -U ems -d ems_test -c 'CREATE DATABASE ems_shadow'
      - run: npm test
      # Prisma 7.10 can exit 0 without comparing anything, so the step also requires its summary
      - name: Migrations match the schema
        run: |
          set +e
          out=$(npm run --silent db:drift -w @ems/backend 2>&1); code=$?
          echo "$out"
          if [ $code -eq 2 ]; then echo "::error::schema.prisma has changes with no migration"; exit 1; fi
          if [ $code -ne 0 ] || ! echo "$out" | grep -q "No difference detected"; then echo "::error::drift check did not run"; exit 1; fi
      - run: npm run build

      # Browser smoke (plan §13): the built API and web app on a freshly seeded database, driven by
      # Playwright in the runner's Google Chrome at 375 and 1280 px, with axe on every page it visits
      - name: Seed a smoke database
        run: |
          password="Smoke-$(openssl rand -hex 12)"
          echo "::add-mask::$password"
          echo "SEED_PASSWORD=$password" >> "$GITHUB_ENV"
          PGPASSWORD=ems-ci psql -h 127.0.0.1 -U ems -d ems_test -c 'CREATE DATABASE ems_smoke'
          export DATABASE_URL=postgresql://ems:ems-ci@127.0.0.1:5432/ems_smoke
          npm run db:deploy
          SEED_PASSWORD="$password" npm run db:seed
      - name: Start the API and the web app
        env:
          DATABASE_URL: postgresql://ems:ems-ci@127.0.0.1:5432/ems_smoke
          NODE_ENV: development
          APP_URL: http://localhost:3000
          TRUST_PROXY_HOPS: '1'
          JOBS_ENABLED: 'false'
          MAIL_DRIVER: console
          MAIL_FROM: EMS smoke <no-reply@ems.invalid>
          STORAGE_DRIVER: local
          STORAGE_LOCAL_DIR: ${{ runner.temp }}/ems-storage
        run: |
          (cd backend && nohup node dist/main.js > "$RUNNER_TEMP/api.log" 2>&1 &)
          (cd frontend && NODE_ENV=production nohup npx next start --port 3000 > "$RUNNER_TEMP/web.log" 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4000/api/v1/health/ready > /dev/null && curl -sf -o /dev/null http://localhost:3000/login && exit 0
            sleep 2
          done
          echo "::error::the API or the web app did not start"; tail -50 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log"; exit 1
      - name: Browser smoke
        env:
          EMS_BASE_URL: http://localhost:3000
        run: |
          google-chrome --version
          npm run e2e -w @ems/frontend
      - name: Server logs
        if: failure()
        run: tail -100 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log" || true
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ems/frontend/playwright-report
            ems/frontend/test-results
          retention-days: 7

  # The Dockerfiles can't be built on the development PC (no Docker), so CI proves them on every change
  images:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Hidden payload check
        run: node scripts/check-payload.mjs
      - name: Build the API, release and web images
        run: |
          docker build -f backend/Dockerfile --target runtime -t ems-api .
          docker build -f backend/Dockerfile --target migrate -t ems-migrate .
          docker build -f frontend/Dockerfile --build-arg API_ORIGIN=http://api:4000 -t ems-web .
      - name: Images run as a non-root user and load their native and generated code
        run: |
          test "$(docker run --rm ems-api id -u)" != "0"
          test "$(docker run --rm ems-web id -u)" != "0"
          docker run --rm ems-api node -e "require('argon2'); require('./dist/generated/prisma/client'); console.log('api ok')"
          docker run --rm ems-web test -f frontend/server.js
          docker run --rm ems-migrate npx prisma --version
