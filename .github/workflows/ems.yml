name: EMS

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ems-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ems
          POSTGRES_PASSWORD: ems-ci
          POSTGRES_DB: ems_test
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U ems -d ems_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL: postgresql://ems:ems-ci@127.0.0.1:5432/ems_test
      SHADOW_DATABASE_URL: postgresql://ems:ems-ci@127.0.0.1:5432/ems_shadow
      TEST_DATABASE_URL: postgresql://ems:ems-ci@127.0.0.1:5432/ems_test
      PRISMA_HIDE_UPDATE_MESSAGE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      # Before installing anything: a compromised config file must never get as far as running
      - name: Hidden payload check
        run: node scripts/check-payload.mjs
      - run: yarn install --immutable
      - name: Known vulnerabilities in dependencies
        run: yarn npm audit --environment production --severity high --recursive
      - run: yarn db:generate
      - run: yarn typecheck
      - run: yarn lint
      - name: Create the shadow database
        run: PGPASSWORD=ems-ci psql -h 127.0.0.1 -U ems -d ems_test -c 'CREATE DATABASE ems_shadow'
      - run: yarn test
      # Prisma 7.10 can exit 0 without comparing anything, so the step also requires its summary
      - name: Migrations match the schema
        run: |
          set +e
          out=$(yarn workspace @ems/backend run db:drift 2>&1); code=$?
          echo "$out"
          if [ $code -eq 2 ]; then echo "::error::schema.prisma has changes with no migration"; exit 1; fi
          if [ $code -ne 0 ] || ! echo "$out" | grep -q "No difference detected"; then echo "::error::drift check did not run"; exit 1; fi
      - run: yarn build

      # Browser smoke (plan §13): the built app (the API runs inside it) on a freshly seeded database, driven by
      # Playwright in the runner's Google Chrome at 375 and 1280 px, with axe on every page it visits
      - name: Seed a smoke database
        run: |
          password="Smoke-$(openssl rand -hex 12)"
          echo "::add-mask::$password"
          echo "SEED_PASSWORD=$password" >> "$GITHUB_ENV"
          PGPASSWORD=ems-ci psql -h 127.0.0.1 -U ems -d ems_test -c 'CREATE DATABASE ems_smoke'
          export DATABASE_URL=postgresql://ems:ems-ci@127.0.0.1:5432/ems_smoke
          yarn db:deploy
          SEED_PASSWORD="$password" yarn db:seed
      - name: Start the app
        env:
          DATABASE_URL: postgresql://ems:ems-ci@127.0.0.1:5432/ems_smoke
          # The API runs in the app's process and shares its NODE_ENV. Production would require real SMTP
          # and S3, which a runner doesn't have, so the production build is served in development mode.
          NODE_ENV: development
          APP_URL: http://localhost:3000
          TRUST_PROXY_HOPS: '1'
          JOBS_ENABLED: 'false'
          MAIL_DRIVER: console
          MAIL_FROM: EMS smoke <no-reply@ems.invalid>
          STORAGE_DRIVER: local
          STORAGE_LOCAL_DIR: ${{ runner.temp }}/ems-storage
        run: |
          (cd apps/web && nohup npx next start --port 3000 > "$RUNNER_TEMP/app.log" 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/v1/health/ready > /dev/null && curl -sf -o /dev/null http://localhost:3000/login && exit 0
            sleep 2
          done
          echo "::error::the app did not start"; tail -50 "$RUNNER_TEMP/app.log"; exit 1
      - name: Browser smoke
        env:
          EMS_BASE_URL: http://localhost:3000
        run: |
          google-chrome --version
          yarn workspace @ems/frontend run e2e
      - name: Server logs
        if: failure()
        run: tail -100 "$RUNNER_TEMP/app.log" || true
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # The Dockerfile can't be built on the development PC (no Docker), so CI proves it on every change
  images:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Hidden payload check
        run: node scripts/check-payload.mjs
      - name: Build the app and release images
        run: |
          docker build -f apps/web/Dockerfile -t ems .
          docker build -f apps/web/Dockerfile --target migrate -t ems-migrate .
      - name: Images run as a non-root user and load their native and generated code
        run: |
          test "$(docker run --rm ems id -u)" != "0"
          docker run --rm ems test -f apps/web/server.js
          docker run --rm ems node -e "require('argon2'); require('@prisma/client/runtime/client'); console.log('app ok')"
          docker run --rm ems-migrate npx prisma --version
